name: Build SophiMarket V2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --stacktrace

      - name: Afficher les JAR produits
        run: |
          echo "Contenu de build/libs :"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print || true

      - name: Préparer le JAR téléchargeable
        run: |
          mkdir -p artifact
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERREUR : aucun JAR compilé trouvé dans build/libs"
            exit 1
          fi
          cp "$JAR" artifact/SophiMarket-V2-NeoForge-1.21.1.jar
          ls -lh artifact/

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: SophiMarket-V2-NeoForge-1.21.1
          path: artifact/SophiMarket-V2-NeoForge-1.21.1.jar
          if-no-files-found: error
          retention-days: 30
